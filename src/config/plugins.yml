# 第三方资源。src/lib/cdn.ts 拼成 https://cdn.cbd.int/{name}@{version}/{file}

# 评论（theme.yml comments.use: Twikoo）
twikoo:
  name: twikoo
  file: dist/twikoo.all.min.js
  version: 1.6.44

# 图片灯箱（theme.yml fancybox: true）
fancybox_css:
  name: "@fancyapps/ui"
  file: dist/fancybox/fancybox.css
  version: 6.1.6
  other_name: fancyapps-ui
fancybox:
  name: "@fancyapps/ui"
  file: dist/fancybox/fancybox.umd.js
  version: 6.1.6
  other_name: fancyapps-ui

# Toast（theme.yml snackbar.enable）
snackbar_css:
  name: node-snackbar
  file: dist/snackbar.min.css
  version: 0.1.16
snackbar:
  name: node-snackbar
  file: dist/snackbar.min.js
  version: 0.1.16

# 图片懒加载
lazyload:
  name: vanilla-lazyload
  file: dist/lazyload.iife.min.js
  version: 19.1.3

# 链接预加载
instantpage:
  name: instant.page
  file: instantpage.js
  version: 5.2.0

# 瀑布流（相册标签）
waterfall:
  name: anzhiyu-theme-static
  file: waterfall/waterfall.js
  version: 1.0.0

# 主题图标字体
ali_iconfont_css:
  name: anzhiyu-theme-static
  file: icon/ali_iconfont_css.css
  version: 1.1.9

# 顶部进度条（preloader.source 为 2 或 3 时加载）
pace_js:
  name: pace-js
  other_name: pace
  file: pace.min.js
  version: 1.2.4
pace_default_css:
  name: anzhiyu-theme-static
  file: progress_bar/progress_bar.css
  version: 1.1.10

# 顶栏音乐（theme.yml nav_music.enable）
aplayer_css:
  name: anzhiyu-theme-static
  file: aplayer/APlayer.min.css
  version: 1.0.0
aplayer_js:
  name: anzhiyu-blog-static
  file: js/APlayer.min.js
  version: 1.0.1
meting_js:
  name: hexo-anzhiyu-music
  file: assets/js/Meting2.min.js
  version: 1.0.1
